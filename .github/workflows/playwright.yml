name: LOLER Inspections Site Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Build Astro site
      run: npm run build
    - name: Run Playwright tests
      run: npm run test:e2e:ci
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  lighthouse:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Lighthouse
      run: npm install lighthouse@13.6.0 --save-dev
    - name: Build Astro site
      run: npm run build
    - name: Start preview server
      run: npm run preview &
    - name: Wait for server to be ready
      run: |
        for i in $(seq 1 30); do
          if curl -s http://127.0.0.1:4321/ > /dev/null; then
            echo "Server is ready"
            exit 0
          fi
          sleep 2
        done
        echo "Server failed to start"
        exit 1
    - name: Run Lighthouse CI
      run: npx lighthouserci collect --url=http://127.0.0.1:4321/ --url=http://127.0.0.1:4321/privacy/ || true
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: lighthouse-report
        path: lighthouse-report.json
        retention-days: 30
